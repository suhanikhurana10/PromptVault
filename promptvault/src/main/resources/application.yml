server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: promptvault

  datasource:
    url: jdbc:mysql://localhost:3306/promptvault?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: sK23102004!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    default-property-inclusion: non_null

# Custom app properties
app:
  jwt:
    # 256-bit+ secret, replace in production. Can also be supplied via APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET:promptvault-super-secret-key-change-this-in-production-min-256-bits}
    access-token-expiration-ms: 3600000        # 1 hour
    refresh-token-expiration-ms: 604800000     # 7 days
    issuer: promptvault-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.promptvault: DEBUG
    org.hibernate.SQL: WARN
